"Producto del inventario."
type Producto {
    id: ID!
    nombre: String!
    precio: Float!
    stock: Int!
    created_at: String
    updated_at: String
}

type Query {
    "Lista todos los productos."
    productos: [Producto!]! @all(model: "App\\Models\\Producto")

    "Busca un producto por su ID."
    producto(id: ID! @eq): Producto @find(model: "App\\Models\\Producto")
}

type Mutation {
    "Crea un producto usando ProductoService (mismas validaciones y reglas que REST)."
    crearProducto(nombre: String!, precio: Float!, stock: Int!): Producto!
        @field(resolver: "App\\GraphQL\\Mutations\\CrearProducto")

    "Cambia el stock de un producto y emite el evento por WebSocket."
    actualizarStock(id: ID!, stock: Int!): Producto!
        @field(resolver: "App\\GraphQL\\Mutations\\ActualizarStock")
}
